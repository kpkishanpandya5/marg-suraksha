name: Nightly content refresh

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

# Required so GITHUB_TOKEN can push the refreshed updates.json back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # fetch-gdelt.ts retries with backoff on GDELT's 429s; cap the job so a stuck
    # run can't hang. On failure the script keeps the last good updates.json.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsx scripts/fetch-gdelt.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/data/updates.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: nightly GDELT refresh"
          git push
