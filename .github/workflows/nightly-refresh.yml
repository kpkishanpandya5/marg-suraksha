name: Nightly content refresh
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsx scripts/fetch-gdelt.ts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/data/updates.json
          git diff --cached --quiet || git commit -m "chore: nightly GDELT refresh"
          git push
